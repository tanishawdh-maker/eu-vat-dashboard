name: Validate data

on:
  push:
    paths: ["data/**", "scripts/**", ".github/workflows/validate.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the VAT dataset
        run: python scripts/validate_data.py
